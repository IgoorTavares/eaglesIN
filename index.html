  <!-- Cabeçalho: logo, XP, streak e engrenagem de configurações -->
  <header class="topbar">
    <button class="brand" data-go="home" aria-label="Início">
      <span class="brand-face" id="brandFace"><img src="icons/pavio-marca.png" alt="" width="34" height="34" /></span>
      <span class="brand-name" id="brandName">Eagles<b>In</b></span>
    </button>
    <div class="top-stats">
      <span class="chip" id="chipStreak" title="Sequência"><svg class="ic" aria-hidden="true"><use href="#i-flame"/></svg>0</span>
      <span class="chip" id="chipXp" title="Nível"><svg class="ic" aria-hidden="true"><use href="#i-graduation-cap"/></svg>A1</span>
      <button class="icon-btn" data-go="settings" aria-label="Configurações"><svg class="ic" aria-hidden="true"><use href="#i-settings"/></svg></button>
    </div>
  </header>

  <!-- Barra do treino guiado (aparece só durante o treino do dia) -->
  <div class="trainbar hidden" id="trainbar">
    <div class="trainbar-row">
      <span id="trainStage">Revisão</span>
      <span id="trainClock">00:00</span>
      <button class="link" id="trainSkip">pular etapa ›</button>
      <button class="link" id="trainStop" aria-label="Sair do treino">✕</button>
    </div>
    <div class="progress"><i id="trainProgress"></i></div>
  </div>

  <!-- As telas são renderizadas aqui pelo app.js -->
  <main id="view" class="view" tabindex="-1"></main>
